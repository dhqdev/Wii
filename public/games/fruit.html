<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Ninja · OpenWii</title>
</head>
<body>
<script src="/js/wii.js"></script>
<script src="/js/game.js"></script>
<script src="/games/fruit-art.js"></script>
<script>
const { U } = OpenWiiGame;
const { ART, BOMB, splat: makeSplat } = FruitArt;
const FRUITS = Object.entries(ART).map(([name, art]) => ({ name, ...art }));

let fruits = [], halves = [], particles = [], splats = [], texts = [], slashes = [];
let score = 0, lives = 3, best = U.best('fruit'), spawnT = 0, elapsed = 0, over = false;
const blades = new Map(); // id -> { x, y, trail: [], slicedAt, combo }
let wood = null;

const G = OpenWiiGame.create({ cursor: 'hand', playCursor: false, onResize: buildWood });

function buildWood(W, H) {
  wood = document.createElement('canvas');
  wood.width = W; wood.height = H;
  const c = wood.getContext('2d');
  const planks = 7, pw = W / planks;
  for (let i = 0; i < planks; i++) {
    const base = [176, 112, 62].map((v) => v + U.randi(-14, 14));
    const g = c.createLinearGradient(i * pw, 0, (i + 1) * pw, 0);
    g.addColorStop(0, `rgb(${base.map((v) => v - 22)})`);
    g.addColorStop(0.5, `rgb(${base})`);
    g.addColorStop(1, `rgb(${base.map((v) => v - 30)})`);
    c.fillStyle = g;
    c.fillRect(i * pw, 0, pw, H);
    c.strokeStyle = 'rgba(70,35,10,.18)';
    c.lineWidth = 1.5;
    for (let k = 0; k < 12; k++) {
      const x = i * pw + U.rand(8, pw - 8);
      c.beginPath();
      c.moveTo(x, 0);
      for (let y = 0; y <= H; y += 40) c.lineTo(x + Math.sin(y / 90 + k) * 6, y);
      c.stroke();
    }
    c.fillStyle = 'rgba(50,25,8,.55)';
    c.fillRect((i + 1) * pw - 3, 0, 4, H);
  }
  const v = c.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.45)');
  c.fillStyle = v;
  c.fillRect(0, 0, W, H);
}

function gravity() { return G.H * 1.25; }

function spawnWave() {
  const n = Math.min(1 + Math.floor(elapsed / 15) + U.randi(0, 2), 6);
  for (let i = 0; i < n; i++) {
    const bombChance = Math.min(0.08 + elapsed / 400, 0.22);
    const isBomb = Math.random() < bombChance && elapsed > 5;
    const type = isBomb ? null : U.pick(FRUITS);
    const r = isBomb ? BOMB.r : type.r;
    const x = U.rand(G.W * 0.18, G.W * 0.82);
    const h = U.rand(G.H * 0.55, G.H * 0.9);
    fruits.push({
      type, bomb: isBomb, r, x, y: G.H + r + U.rand(0, 60),
      vx: (G.W / 2 - x) * U.rand(0.15, 0.45) + U.rand(-60, 60),
      vy: -Math.sqrt(2 * gravity() * h),
      a: U.rand(-0.6, 0.6), va: U.rand(-2.5, 2.5),
    });
  }
}

function reset() {
  fruits = []; halves = []; particles = []; splats = []; texts = []; slashes = [];
  score = 0; lives = 3; spawnT = 0.6; elapsed = 0; over = false;
  blades.clear();
  G.wii.sfx.start();
}

function sliceFruit(f, angle, blade) {
  f.dead = true;
  if (f.bomb) return explode(f);
  G.wii.sfx.slice();
  setTimeout(() => G.wii.sfx.splat(), 30);
  const nx = Math.cos(angle + Math.PI / 2), ny = Math.sin(angle + Math.PI / 2);
  // as metades nascem alinhadas com o golpe; spin guarda a rotação que a fruta tinha
  for (const s of [1, -1]) {
    halves.push({ type: f.type, r: f.r, x: f.x + nx * 3 * s, y: f.y + ny * 3 * s, vx: f.vx * 0.6 + nx * 150 * s + Math.cos(angle) * 60, vy: f.vy * 0.35 + ny * 150 * s - 80, a: angle, spin: f.a - angle, va: s * U.rand(1.5, 4), side: s, life: 3 });
  }
  for (let i = 0; i < 26; i++) {
    const a = U.rand(0, 6.28), sp = U.rand(80, 520);
    particles.push({ x: f.x, y: f.y, vx: Math.cos(a) * sp + Math.cos(angle) * 200, vy: Math.sin(a) * sp - 140, r: U.rand(2, 8), c: Math.random() < 0.7 ? f.type.juice : f.type.juice2, life: U.rand(0.35, 0.9) });
  }
  slashes.push({ x: f.x, y: f.y, a: angle, r: f.r, life: 0.25 });
  splats.push({ x: f.x, y: f.y, a: U.rand(0, 6.28), life: 5, img: makeSplat(f.r * U.rand(1.1, 1.5), f.type.juice, Math.floor(Math.random() * 1e9)) });
  if (splats.length > 25) splats.shift();
  score += 1;
  blade.combo.push({ x: f.x, y: f.y });
  G.wii.rumble(blade.id, 25);
}

function explode(f) {
  G.wii.sfx.boom();
  G.rumbleAll(400);
  for (let i = 0; i < 60; i++) {
    const a = U.rand(0, 6.28), sp = U.rand(100, 900);
    particles.push({ x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: U.rand(4, 12), c: U.pick(['#fff', '#ffd23f', '#ff7a1f', '#555']), life: U.rand(0.5, 1.4) });
  }
  flash = 1;
  gameOver('💣 Você cortou uma bomba!');
}

let flash = 0;
function gameOver(reason) {
  if (over) return;
  over = true;
  const rec = U.saveBest('fruit', score);
  best = Math.max(best, score);
  setTimeout(() => {
    G.wii.sfx.over();
    G.menu({
      title: 'Fim de jogo',
      text: reason,
      html: `<div class="big">${score}</div><p>${rec ? '🏆 Novo recorde!' : `Recorde: ${best}`}</p>`,
      primary: 'Jogar de novo',
      onPrimary: reset,
    });
  }, 900);
}

function update(dt) {
  if (!G.playing) return;
  elapsed += dt;
  const g = gravity();

  if (!over) {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnWave();
      spawnT = Math.max(0.75, 1.9 - elapsed / 60);
    }
  }

  // lâminas (uma por jogador)
  for (const p of G.players()) {
    let b = blades.get(p.id);
    if (!b) { b = { id: p.id, x: p.x, y: p.y, trail: [], combo: [], comboT: 0, color: p.color }; blades.set(p.id, b); }
    const dx = p.x - b.x, dy = p.y - b.y;
    const speed = Math.hypot(dx, dy) / Math.max(dt, 0.001);
    const active = speed > 700;
    if (active && !over) {
      const ang = Math.atan2(dy, dx);
      for (const f of fruits) {
        if (!f.dead && U.segDist(f.x, f.y, b.x, b.y, p.x, p.y) < f.r) sliceFruit(f, ang, b);
      }
      if (b.trail.length === 0 || speed > 900) { if (Math.random() < 0.15) G.wii.sfx.slice(); }
    }
    b.trail.push({ x: p.x, y: p.y, t: elapsed, on: active });
    while (b.trail.length && elapsed - b.trail[0].t > 0.18) b.trail.shift();
    b.x = p.x; b.y = p.y;

    // combos: várias frutas no mesmo golpe
    if (b.combo.length) {
      b.comboT += dt;
      if (!active || b.comboT > 0.35) {
        if (b.combo.length >= 3) {
          const bonus = b.combo.length;
          score += bonus;
          const c = b.combo[b.combo.length - 1];
          texts.push({ x: c.x, y: c.y, s: `${b.combo.length} frutas! +${bonus}`, life: 1.2, c: '#ffe14d' });
          G.wii.sfx.coin();
        }
        b.combo = []; b.comboT = 0;
      }
    }
  }
  for (const id of blades.keys()) if (!G.wii.players.has(id)) blades.delete(id);

  for (const f of fruits) {
    f.vy += g * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.va * dt;
    if (!f.dead && f.vy > 0 && f.y > G.H + f.r + 10) {
      f.dead = true;
      if (!f.bomb && !over) {
        lives--;
        G.wii.sfx.bad();
        texts.push({ x: U.clamp(f.x, 60, G.W - 60), y: G.H - 60, s: '✖', life: 1, c: '#ff4040' });
        if (lives <= 0) gameOver('Você deixou cair 3 frutas.');
      }
    }
  }
  fruits = fruits.filter((f) => !f.dead);
  for (const h of halves) { h.vy += g * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.a += h.va * dt; h.life -= dt; }
  halves = halves.filter((h) => h.life > 0 && h.y < G.H + 120);
  for (const q of particles) { q.vy += g * 0.6 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter((q) => q.life > 0);
  for (const s of slashes) s.life -= dt;
  slashes = slashes.filter((s) => s.life > 0);
  for (const s of splats) s.life -= dt;
  splats = splats.filter((s) => s.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 40 * dt; }
  texts = texts.filter((t) => t.life > 0);
  flash = Math.max(0, flash - dt * 1.5);
}

function drawSprite(c, img, x, y, a) {
  const s = img.width / FruitArt.S;
  c.save();
  c.translate(x, y);
  c.rotate(a);
  c.drawImage(img, -s / 2, -s / 2, s, s);
  c.restore();
}

// sombra suave projetada na madeira (dá profundidade)
function drawShadow(c, x, y, r) {
  const g = c.createRadialGradient(x + r * 0.35, y + r * 0.55, 0, x + r * 0.35, y + r * 0.55, r * 1.1);
  g.addColorStop(0, 'rgba(30,12,0,.35)');
  g.addColorStop(1, 'rgba(30,12,0,0)');
  c.fillStyle = g;
  c.beginPath(); c.ellipse(x + r * 0.35, y + r * 0.55, r * 1.1, r * 0.9, 0, 0, 7); c.fill();
}

function drawHalf(c, h) {
  c.save();
  c.globalAlpha = Math.min(1, h.life * 2);
  c.translate(h.x, h.y);
  c.rotate(h.a);
  // recorta metade da fruta: casca por trás e polpa por cima
  const R = h.r * 1.6;
  c.beginPath();
  c.rect(-R, h.side > 0 ? 0 : -R, R * 2, R);
  c.clip();
  c.rotate(h.spin);
  const s = h.type.whole.width / FruitArt.S;
  c.drawImage(h.type.whole, -s / 2, -s / 2, s, s);
  c.rotate(-h.spin);
  // a polpa fica levemente achatada, como se estivesse virada para a tela
  c.scale(1, 0.98);
  c.rotate(h.spin);
  c.drawImage(h.type.inside, -s / 2, -s / 2, s, s);
  c.restore();
}

function drawBlade(c, b) {
  const tr = b.trail;
  if (tr.length < 2) return;
  const active = tr[tr.length - 1].on;
  // polígono afinando do fim para a ponta
  const left = [], right = [];
  for (let i = 0; i < tr.length; i++) {
    const p = tr[i], q = tr[Math.min(i + 1, tr.length - 1)], o = tr[Math.max(i - 1, 0)];
    const ang = Math.atan2(q.y - o.y, q.x - o.x) + Math.PI / 2;
    const w = (active ? 11 : 3) * Math.pow(i / (tr.length - 1), 1.4);
    left.push([p.x + Math.cos(ang) * w, p.y + Math.sin(ang) * w]);
    right.push([p.x - Math.cos(ang) * w, p.y - Math.sin(ang) * w]);
  }
  const poly = () => {
    c.beginPath();
    left.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
    for (let i = right.length - 1; i >= 0; i--) c.lineTo(right[i][0], right[i][1]);
    c.closePath();
  };
  c.save();
  c.globalCompositeOperation = 'lighter';
  if (active) {
    c.shadowColor = b.color; c.shadowBlur = 28;
    c.fillStyle = b.color; c.globalAlpha = 0.7; poly(); c.fill();
    c.shadowBlur = 0;
  }
  c.globalAlpha = active ? 1 : 0.35;
  c.fillStyle = '#ffffff'; poly(); c.fill();
  c.restore();
}

function draw() {
  const c = G.ctx;
  if (wood) c.drawImage(wood, 0, 0, G.W, G.H);

  for (const s of splats) {
    c.save();
    c.globalAlpha = Math.min(0.75, s.life / 3);
    c.translate(s.x, s.y); c.rotate(s.a);
    const sz = s.img.width / FruitArt.S;
    c.drawImage(s.img, -sz / 2, -sz / 2, sz, sz);
    c.restore();
  }
  for (const h of halves) drawShadow(c, h.x, h.y, h.r * 0.8);
  for (const f of fruits) drawShadow(c, f.x, f.y, f.r);
  for (const h of halves) drawHalf(c, h);
  for (const f of fruits) {
    if (f.bomb) {
      drawSprite(c, BOMB.whole, f.x, f.y, f.a);
      // faísca do pavio
      const fx = f.x + Math.cos(f.a) * BOMB.fuse.x - Math.sin(f.a) * BOMB.fuse.y;
      const fy = f.y + Math.sin(f.a) * BOMB.fuse.x + Math.cos(f.a) * BOMB.fuse.y;
      const g = c.createRadialGradient(fx, fy, 0, fx, fy, 16);
      g.addColorStop(0, 'rgba(255,255,220,1)'); g.addColorStop(0.3, 'rgba(255,190,40,.9)'); g.addColorStop(1, 'rgba(255,80,0,0)');
      c.fillStyle = g; c.beginPath(); c.arc(fx, fy, 14 + Math.random() * 6, 0, 7); c.fill();
      if (Math.random() < 0.8) particles.push({ x: fx, y: fy, vx: U.rand(-120, 120), vy: U.rand(-160, 20), r: U.rand(1.5, 3), c: U.pick(['#fff3a0', '#ffb020', '#ff6a00']), life: U.rand(0.15, 0.35), glow: true });
    } else {
      drawSprite(c, f.type.whole, f.x, f.y, f.a);
    }
  }
  for (const q of particles) {
    c.globalAlpha = Math.min(1, q.life * 2.5);
    c.fillStyle = q.c;
    c.beginPath();
    if (q.glow) c.arc(q.x, q.y, q.r, 0, 7);
    else c.ellipse(q.x, q.y, q.r * 1.25, q.r * 0.9, Math.atan2(q.vy, q.vx), 0, 7);
    c.fill();
    if (!q.glow && q.r > 4) {
      c.fillStyle = 'rgba(255,255,255,.45)';
      c.beginPath(); c.arc(q.x - q.r * 0.3, q.y - q.r * 0.3, q.r * 0.3, 0, 7); c.fill();
    }
  }
  c.globalAlpha = 1;

  // brilho do corte
  for (const s of slashes) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = s.life / 0.25;
    c.translate(s.x, s.y); c.rotate(s.a);
    const len = s.r * 3 * (1.2 - s.life / 0.25 * 0.4);
    const g = c.createLinearGradient(-len, 0, len, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,240,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, len, 4, 0, 0, 7); c.fill();
    c.restore();
  }

  for (const b of blades.values()) {
    drawBlade(c, b);
    c.fillStyle = '#fff';
    c.shadowColor = b.color; c.shadowBlur = 12;
    c.beginPath(); c.arc(b.x, b.y, 5, 0, 7); c.fill();
    c.shadowBlur = 0;
  }

  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const t of texts) {
    c.globalAlpha = Math.min(1, t.life * 1.5);
    c.font = '900 32px system-ui';
    c.lineWidth = 6; c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(t.s, t.x, t.y);
    c.fillStyle = t.c; c.fillText(t.s, t.x, t.y);
  }
  c.globalAlpha = 1;
  if (flash > 0) { c.fillStyle = `rgba(255,255,255,${flash})`; c.fillRect(0, 0, G.W, G.H); }

  G.hudL.innerHTML = `🍉 ${score}<div class="sub">Recorde: ${best}</div>`;
  G.hudR.innerHTML = `<span style="color:#ff4040">${'✖'.repeat(3 - lives)}</span><span style="opacity:.35">${'✖'.repeat(Math.max(0, lives))}</span>`;
}

G.loop((dt) => { update(dt); draw(); });
G.menu({
  title: '🍉 Fruit Ninja',
  text: 'O celular é a sua espada. Corte as frutas, fuja das bombas!',
  how: [['Mover', 'Balance o celular rápido para cortar'], ['💣', 'Não corte as bombas'], ['✖', 'Deixar cair 3 frutas = fim'], ['⌂', 'Voltar ao menu']],
  primary: 'Jogar',
  onPrimary: reset,
});
</script>
</body>
</html>
