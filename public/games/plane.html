<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aviãozinho · OpenWii</title>
</head>
<body>
<script src="/js/wii.js"></script>
<script src="/js/game.js"></script>
<script>
const { U } = OpenWiiGame;
let plane, items, clouds, particles, texts, hills;
let score = 0, lives = 3, dist = 0, speed = 0, spawnT = 0, best = U.best('plane'), over = false, turboHeld = false, fuel = 1, inv = 0, t = 0;
const G = OpenWiiGame.create({
  cursor: 'hand', playCursor: false,
  onResize: () => { hills = makeHills(); },
  onButton(p, btn, down) {
    if (btn === 'B' || btn === 'A') turboHeld = down;
  },
});


function makeHills() {
  const layers = [];
  for (const [col, amp, base, sp] of [['#9ad7a4', 0.08, 0.86, 0.2], ['#6cc27c', 0.06, 0.92, 0.45]]) {
    const pts = [];
    for (let i = 0; i < 40; i++) pts.push(U.rand(0.3, 1));
    layers.push({ col, amp, base, sp, pts, off: 0 });
  }
  return layers;
}

function reset() {
  plane = { x: G.W * 0.25, y: G.H / 2, vy: 0, a: 0, prop: 0 };
  items = []; particles = []; texts = [];
  clouds = Array.from({ length: 9 }, () => ({ x: U.rand(0, G.W), y: U.rand(0, G.H * 0.7), s: U.rand(0.5, 1.4), sp: U.rand(0.15, 0.5) }));
  score = 0; lives = 3; dist = 0; speed = G.W * 0.28; spawnT = 1; over = false; fuel = 1; inv = 0;
  G.wii.sfx.start();
}

function spawn() {
  const r = Math.random();
  const y = U.rand(G.H * 0.1, G.H * 0.8);
  if (r < 0.35) {
    // fileira de estrelas em onda
    const n = U.randi(4, 7), base = y, amp = U.rand(30, 90);
    for (let i = 0; i < n; i++) items.push({ kind: 'star', x: G.W + 40 + i * 60, y: U.clamp(base + Math.sin(i * 0.8) * amp, 40, G.H * 0.82), r: 18 });
  } else if (r < 0.55) {
    items.push({ kind: 'ring', x: G.W + 60, y, r: 60 });
  } else if (r < 0.8) {
    items.push({ kind: 'bird', x: G.W + 40, y, r: 24, vy: U.rand(-40, 40), f: Math.random() * 6 });
  } else {
    items.push({ kind: 'storm', x: G.W + 100, y: U.rand(G.H * 0.1, G.H * 0.6), r: 70 });
  }
}

function hit(it) {
  if (inv > 0) return;
  lives--; inv = 1.5;
  G.wii.sfx.bad();
  G.rumbleAll(250);
  for (let i = 0; i < 20; i++) particles.push({ x: plane.x, y: plane.y, vx: U.rand(-200, 200), vy: U.rand(-200, 200), r: U.rand(3, 7), c: U.pick(['#fff', '#ccc', '#ff5d5d']), life: U.rand(0.4, 0.9) });
  if (lives <= 0) gameOver();
}

function gameOver() {
  over = true;
  const final = Math.floor(score);
  const rec = U.saveBest('plane', final);
  best = Math.max(best, final);
  G.wii.sfx.over();
  setTimeout(() => G.menu({
    title: 'Pouso forçado!', text: `Você voou ${Math.floor(dist / 50)} m.`,
    html: `<div class="big">${final}</div><p>${rec ? '🏆 Novo recorde!' : `Recorde: ${best}`}</p>`,
    primary: 'Voar de novo', onPrimary: reset,
  }), 700);
}

function update(dt) {
  t += dt;
  if (!plane) return;
  for (const cl of clouds) { cl.x -= speed * cl.sp * dt * (G.playing ? 1 : 0.2); if (cl.x < -200) { cl.x = G.W + 100; cl.y = U.rand(0, G.H * 0.7); } }
  for (const h of hills) { h.off += speed * h.sp * dt * (G.playing ? 1 : 0.2); }
  if (!G.playing || over) return;

  const p = G.players()[0];
  const turbo = turboHeld && fuel > 0;
  fuel = U.clamp(fuel + (turbo ? -0.45 : 0.12) * dt, 0, 1);
  const sp = speed * (turbo ? 1.8 : 1);
  speed += G.W * 0.006 * dt;
  dist += sp * dt;
  score += dt * (turbo ? 4 : 2);

  if (p) {
    const ty = U.clamp(p.y, 40, G.H * 0.86);
    const tx = U.clamp(p.x, G.W * 0.1, G.W * 0.55);
    const oy = plane.y;
    plane.y += (ty - plane.y) * Math.min(1, dt * 6);
    plane.x += (tx - plane.x) * Math.min(1, dt * 3);
    plane.vy = (plane.y - oy) / dt;
  }
  plane.a = U.clamp(plane.vy / 900, -0.6, 0.6);
  plane.prop += dt * 40;
  inv = Math.max(0, inv - dt);

  if (Math.random() < (turbo ? 0.9 : 0.4)) particles.push({ x: plane.x - 40, y: plane.y + 4, vx: -sp * 0.5, vy: U.rand(-20, 20), r: U.rand(4, 8), c: turbo ? '#ffb347' : 'rgba(255,255,255,.8)', life: 0.6 });

  spawnT -= dt * (sp / speed);
  if (spawnT <= 0) { spawn(); spawnT = U.rand(0.6, 1.3) * Math.max(0.55, 1 - dist / 60000); }

  for (const it of items) {
    it.x -= sp * dt * (it.kind === 'bird' ? 1.25 : 1);
    if (it.kind === 'bird') { it.y += Math.sin(t * 3 + it.f) * 60 * dt + it.vy * dt; it.f += dt * 12; }
    const d = Math.hypot(it.x - plane.x, it.y - plane.y);
    if (it.dead) continue;
    if (it.kind === 'star' && d < it.r + 34) {
      it.dead = true; score += 10 * (turbo ? 2 : 1); G.wii.sfx.coin();
      texts.push({ x: it.x, y: it.y, s: turbo ? '+20' : '+10', life: 0.8 });
    } else if (it.kind === 'ring' && Math.abs(it.x - plane.x) < 14 && !it.passed) {
      it.passed = true;
      if (Math.abs(it.y - plane.y) < it.r * 0.8) {
        score += 50; G.wii.sfx.hit(); G.wii.rumble(p ? p.id : 0, 40);
        texts.push({ x: it.x, y: it.y - it.r, s: 'Perfeito! +50', life: 1.1 });
        for (let i = 0; i < 16; i++) particles.push({ x: it.x, y: it.y, vx: U.rand(-250, 250), vy: U.rand(-250, 250), r: U.rand(3, 6), c: '#ffd23f', life: 0.8 });
      }
    } else if (it.kind === 'bird' && d < it.r + 26) { it.dead = true; hit(it); }
    else if (it.kind === 'storm' && d < it.r * 0.8 + 20) { it.dead = true; hit(it); }
  }
  items = items.filter((it) => it.x > -150 && !(it.dead && it.kind !== 'ring'));
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter((q) => q.life > 0);
  for (const tx of texts) { tx.life -= dt; tx.y -= 50 * dt; }
  texts = texts.filter((tx) => tx.life > 0);
}

function drawCloud(c, x, y, s, col = '#fff') {
  c.fillStyle = col;
  c.beginPath();
  c.arc(x, y, 30 * s, 0, 7); c.arc(x + 34 * s, y - 14 * s, 38 * s, 0, 7); c.arc(x + 74 * s, y, 30 * s, 0, 7);
  c.rect(x, y, 74 * s, 30 * s);
  c.fill();
}

function drawPlane(c) {
  c.save();
  c.translate(plane.x, plane.y);
  c.rotate(plane.a);
  if (inv > 0 && Math.floor(inv * 10) % 2) c.globalAlpha = 0.4;
  // asa traseira
  c.fillStyle = '#c92a2a';
  c.beginPath(); c.moveTo(-40, -4); c.lineTo(-52, -26); c.lineTo(-38, -26); c.lineTo(-26, -4); c.fill();
  // corpo
  const g = c.createLinearGradient(0, -16, 0, 16);
  g.addColorStop(0, '#ff6b6b'); g.addColorStop(1, '#d63031');
  c.fillStyle = g;
  c.beginPath(); c.ellipse(0, 0, 46, 15, 0, 0, 7); c.fill();
  // janela + piloto
  c.fillStyle = '#bfe9ff';
  c.beginPath(); c.ellipse(8, -10, 13, 9, 0, Math.PI, 0); c.fill();
  c.fillStyle = '#6b4226';
  c.beginPath(); c.arc(6, -12, 5, 0, 7); c.fill();
  // asa
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(-2, 6, 26, 7, 0.1, 0, 7); c.fill();
  c.strokeStyle = '#d63031'; c.lineWidth = 2; c.stroke();
  // nariz e hélice
  c.fillStyle = '#ffd23f';
  c.beginPath(); c.arc(46, 0, 6, 0, 7); c.fill();
  c.fillStyle = 'rgba(60,60,60,.75)';
  const ph = Math.abs(Math.sin(plane.prop)) * 26 + 4;
  c.fillRect(50, -ph / 2, 4, ph);
  c.restore();
}

function draw() {
  const c = G.ctx;
  const sky = c.createLinearGradient(0, 0, 0, G.H);
  sky.addColorStop(0, '#4fb3f6'); sky.addColorStop(1, '#c9ecff');
  c.fillStyle = sky; c.fillRect(0, 0, G.W, G.H);
  c.fillStyle = 'rgba(255,240,180,.9)';
  c.beginPath(); c.arc(G.W * 0.85, G.H * 0.15, 50, 0, 7); c.fill();
  if (clouds) for (const cl of clouds) { c.globalAlpha = 0.85; drawCloud(c, cl.x, cl.y, cl.s); }
  c.globalAlpha = 1;

  for (const h of hills || []) {
    c.fillStyle = h.col;
    c.beginPath(); c.moveTo(0, G.H);
    const seg = G.W / 8;
    for (let x = -seg; x <= G.W + seg; x += 8) {
      const u = (x + h.off) / seg;
      const i = Math.floor(u), f = u - i;
      const a = h.pts[((i % 40) + 40) % 40], b = h.pts[(((i + 1) % 40) + 40) % 40];
      const v = a + (b - a) * (0.5 - Math.cos(f * Math.PI) / 2);
      c.lineTo(x, G.H * h.base - v * G.H * h.amp * 2);
    }
    c.lineTo(G.W, G.H); c.fill();
  }

  for (const it of items || []) {
    if (it.kind === 'star') {
      c.save(); c.translate(it.x, it.y); c.rotate(t * 2);
      c.fillStyle = '#ffd23f'; c.strokeStyle = '#e8a400'; c.lineWidth = 3;
      c.beginPath();
      for (let i = 0; i < 10; i++) { const r = i % 2 ? it.r * 0.45 : it.r; const a = i * Math.PI / 5 - Math.PI / 2; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.closePath(); c.fill(); c.stroke(); c.restore();
    } else if (it.kind === 'ring') {
      c.lineWidth = 12;
      c.strokeStyle = it.passed ? 'rgba(255,210,63,.35)' : '#ffd23f';
      c.beginPath(); c.ellipse(it.x, it.y, 18, it.r, 0, 0, 7); c.stroke();
      c.lineWidth = 3; c.strokeStyle = '#fff';
      c.beginPath(); c.ellipse(it.x, it.y, 18, it.r, 0, 0, 7); c.stroke();
    } else if (it.kind === 'bird') {
      c.save(); c.translate(it.x, it.y);
      c.fillStyle = '#3b3b4f';
      c.beginPath(); c.ellipse(0, 0, 20, 12, 0, 0, 7); c.fill();
      const w = Math.sin(it.f) * 18;
      c.beginPath(); c.moveTo(-6, -2); c.quadraticCurveTo(0, -20 - w, 12, -4); c.fill();
      c.fillStyle = '#ffb020'; c.beginPath(); c.moveTo(-20, -2); c.lineTo(-30, 2); c.lineTo(-20, 5); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-12, -4, 4, 0, 7); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(-13, -4, 2, 0, 7); c.fill();
      c.restore();
    } else if (it.kind === 'storm') {
      drawCloud(c, it.x - 74, it.y, 1.3, '#5b6270');
      if (Math.floor(t * 6) % 3 === 0) {
        c.strokeStyle = '#ffe14d'; c.lineWidth = 4;
        c.beginPath(); c.moveTo(it.x, it.y + 30); c.lineTo(it.x - 10, it.y + 60); c.lineTo(it.x + 6, it.y + 62); c.lineTo(it.x - 6, it.y + 96); c.stroke();
      }
    }
  }
  for (const q of particles || []) { c.globalAlpha = Math.max(0, q.life); c.fillStyle = q.c; c.beginPath(); c.arc(q.x, q.y, q.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  if (plane) drawPlane(c);
  c.textAlign = 'center'; c.font = '900 26px system-ui';
  for (const tx of texts || []) {
    c.globalAlpha = Math.min(1, tx.life * 2);
    c.lineWidth = 5; c.strokeStyle = 'rgba(0,0,0,.4)'; c.strokeText(tx.s, tx.x, tx.y);
    c.fillStyle = '#fff'; c.fillText(tx.s, tx.x, tx.y);
  }
  c.globalAlpha = 1;

  G.hudL.innerHTML = `✈️ ${Math.floor(score)}<div class="sub">${Math.floor(dist / 50)} m · Recorde: ${best}</div>`;
  G.hudR.innerHTML = `${'❤️'.repeat(Math.max(0, lives))}<div class="sub">Turbo <span style="display:inline-block;width:90px;height:10px;border-radius:6px;background:rgba(255,255,255,.4);vertical-align:middle;overflow:hidden"><span style="display:block;height:100%;width:${fuel * 100}%;background:#ffb347"></span></span></div>`;
}

reset();
G.loop((dt) => { update(dt); draw(); });
G.menu({
  title: '✈️ Aviãozinho',
  text: 'Pilote o avião apontando o celular. Pegue estrelas, passe pelos anéis e desvie dos pássaros e tempestades.',
  how: [['Apontar', 'Move o avião'], ['A / B', 'Segure para turbo (pontos em dobro)'], ['⭐ / ⭕', '+10 / +50 pontos'], ['🐦 ⛈', 'Perde uma vida']],
  primary: 'Decolar', onPrimary: reset,
});
</script>
</body>
</html>
